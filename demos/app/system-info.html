<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统信息 - HarmonyOS Electron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .refresh-btn, .calendar-btn, .print-btn, .export-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .refresh-btn:hover, .calendar-btn:hover, .print-btn:hover, .export-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .refresh-btn:active, .calendar-btn:active, .print-btn:active, .export-btn:active {
            transform: translateY(0);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            page-break-inside: avoid;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            font-size: 1.8em;
        }

        .info-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .info-value {
            color: #333;
            font-size: 1.1em;
            word-break: break-all;
        }

        .info-value.highlight {
            color: #667eea;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .network-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #e8f4f8;
            border-radius: 5px;
        }

        .network-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .network-detail {
            font-size: 0.9em;
            color: #666;
        }

        .cpu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #fff3cd;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .cpu-core {
            font-weight: 600;
            color: #856404;
        }

        .cpu-speed {
            font-size: 0.9em;
            color: #666;
        }

        .timestamp {
            text-align: center;
            color: white;
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 20px;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .header {
                color: #333;
                margin-bottom: 20px;
            }

            .header h1 {
                text-shadow: none;
            }

            .button-group {
                display: none;
            }

            .info-card {
                box-shadow: none;
                border: 1px solid #ddd;
                page-break-inside: avoid;
            }

            .timestamp {
                color: #666;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💻 系统信息查看器</h1>
            <p>HarmonyOS Electron 系统信息演示</p>
            <div class="button-group">
                <button class="refresh-btn" onclick="loadSystemInfo()">🔄 刷新信息</button>
                <button class="print-btn" onclick="printSystemInfo()">🖨️ 打印报告</button>
                <button class="export-btn" onclick="exportSystemInfo()">📄 导出报告</button>
                  <button class="calendar-btn" onclick="openCalendar()">📅 日历</button>
            </div>
        </div>

        <div id="loading" class="loading">正在获取系统信息</div>
        <div id="content" style="display: none;"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Load system information on page load
        window.addEventListener('DOMContentLoaded', loadSystemInfo);

        /**
         * 检查开发模式 - 展示开发模式检测功能
         */
        async function checkDevelopmentMode() {
            try {
                const isDev = await ipcRenderer.invoke('is-development');
                const modeInfo = await ipcRenderer.invoke('get-app-mode-info');
                console.log('开发模式检测:', isDev);
                console.log('应用模式信息:', modeInfo);
                if (isDev) {
                    console.log('🔧 开发模式: 启用调试功能');
                } else {
                    console.log('🚀 生产模式: 优化性能');
                }
            } catch (error) {
                console.error('检查开发模式失败:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', checkDevelopmentMode);

        async function loadSystemInfo() {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('content');

            loadingDiv.style.display = 'block';
            contentDiv.style.display = 'none';

            try {
                const info = await ipcRenderer.invoke('get-system-info');
                displaySystemInfo(info);
            } catch (error) {
                console.error('Error loading system info:', error);
                loadingDiv.innerHTML = '❌ 获取系统信息失败: ' + error.message;
            }
        }

        function displaySystemInfo(info) {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('content');

            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'block';

            contentDiv.innerHTML = `
                <div class="info-grid">
                    <!-- OS Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">🖥️</span>
                            操作系统信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">平台</div>
                            <div class="info-value highlight">${info.platform}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">架构</div>
                            <div class="info-value highlight">${info.arch}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">系统版本</div>
                            <div class="info-value">${info.release}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">主机名</div>
                            <div class="info-value">${info.hostname}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">系统类型</div>
                            <div class="info-value">${info.type}</div>
                        </div>
                    </div>

                    <!-- CPU Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">⚡</span>
                            CPU 信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">CPU 型号</div>
                            <div class="info-value highlight">${info.cpuModel}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">CPU 核心数</div>
                            <div class="info-value highlight">${info.cpuCount}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">CPU 核心详情</div>
                            ${info.cpus.slice(0, 4).map(cpu => `
                                <div class="cpu-item">
                                    <span class="cpu-core">核心 ${cpu.model.split('@')[0].trim()}</span>
                                    <span class="cpu-speed">${(cpu.speed / 1000).toFixed(2)} GHz</span>
                                </div>
                            `).join('')}
                            ${info.cpus.length > 4 ? `<div class="info-value" style="font-size: 0.9em; color: #666;">... 还有 ${info.cpus.length - 4} 个核心</div>` : ''}
                        </div>
                    </div>

                    <!-- Memory Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">💾</span>
                            内存信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">总内存</div>
                            <div class="info-value highlight">${formatBytes(info.totalMemory)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">可用内存</div>
                            <div class="info-value">${formatBytes(info.freeMemory)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">已用内存</div>
                            <div class="info-value">${formatBytes(info.usedMemory)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">内存使用率</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${info.memoryUsagePercent}%"></div>
                            </div>
                            <div class="progress-text">${info.memoryUsagePercent}%</div>
                        </div>
                    </div>

                    <!-- Display Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">🖼️</span>
                            显示器信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">显示器数量</div>
                            <div class="info-value highlight">${info.displays.length}</div>
                        </div>
                        ${info.primaryDisplay ? `
                        <div class="info-item">
                            <div class="info-label">主显示器分辨率</div>
                            <div class="info-value highlight">${info.primaryDisplay.size.width} x ${info.primaryDisplay.size.height}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">主显示器工作区</div>
                            <div class="info-value">${info.primaryDisplay.workAreaSize.width} x ${info.primaryDisplay.workAreaSize.height}</div>
                        </div>
                        ` : ''}
                    </div>

                    <!-- Network Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">🌐</span>
                            网络信息
                        </div>
                        ${Object.entries(info.networkInterfaces).map(([name, interfaces]) => `
                            <div class="network-item">
                                <div class="network-header">${name}</div>
                                ${interfaces.map(iface => `
                                    <div class="network-detail">
                                        ${iface.family}: ${iface.address}
                                        ${iface.internal ? ' (内部)' : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>

                    <!-- System Uptime -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">⏱️</span>
                            系统运行时间
                        </div>
                        <div class="info-item">
                            <div class="info-label">运行时间</div>
                            <div class="info-value highlight">${info.uptimeFormatted}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">运行秒数</div>
                            <div class="info-value">${Math.floor(info.uptime)} 秒</div>
                        </div>
                    </div>

                    <!-- Locale Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">🌍</span>
                            语言和地区
                        </div>
                        <div class="info-item">
                            <div class="info-label">应用语言</div>
                            <div class="info-value highlight">${info.locale}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">系统语言</div>
                            <div class="info-value">${info.systemLocale}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">主目录</div>
                            <div class="info-value">${info.homedir}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">临时目录</div>
                            <div class="info-value">${info.tmpdir}</div>
                        </div>
                    </div>

                    <!-- Application Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">📱</span>
                            应用信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">应用名称</div>
                            <div class="info-value highlight">${info.appName}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">应用版本</div>
                            <div class="info-value">${info.appVersion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">应用路径</div>
                            <div class="info-value">${info.appPath}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">用户名</div>
                            <div class="info-value">${info.userInfo.username}</div>
                        </div>
                    </div>

                    <!-- Version Information -->
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">🔧</span>
                            版本信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">Electron 版本</div>
                            <div class="info-value highlight">${info.electronVersion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Chrome 版本</div>
                            <div class="info-value">${info.chromeVersion}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Node.js 版本</div>
                            <div class="info-value">${info.nodeVersion}</div>
                        </div>
                    </div>

                    <!-- Application Mode Information (开发模式检测) -->
                    ${info.appMode ? `
                    <div class="info-card">
                        <div class="card-title">
                            <span class="card-icon">⚙️</span>
                            应用模式信息
                        </div>
                        <div class="info-item">
                            <div class="info-label">运行模式</div>
                            <div class="info-value highlight">${info.appMode.isDevelopment ? '🔧 开发模式' : '🚀 生产模式'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">是否打包</div>
                            <div class="info-value">${info.appMode.isPackaged ? '✅ 是' : '❌ 否'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">NODE_ENV</div>
                            <div class="info-value">${info.appMode.nodeEnv}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">平台架构</div>
                            <div class="info-value">${info.appMode.platform} - ${info.appMode.arch}</div>
                        </div>
                    </div>
                    ` : ''}
                </div>

                <div class="timestamp">
                    📅 最后更新: ${new Date(info.timestamp).toLocaleString('zh-CN')}
                </div>
            `;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        /**
         * 打印系统信息报告
         * 使用浏览器的打印功能，配合 CSS @media print 样式
         */
        function printSystemInfo() {
            const contentDiv = document.getElementById('content');
            if (contentDiv.style.display === 'none') {
                alert('请先加载系统信息后再打印！');
                return;
            }
            window.print();
        }

        /**
         * 导出系统信息报告为文本文件
         * 通过 IPC 调用主进程的导出功能
         */
        async function exportSystemInfo() {
            const contentDiv = document.getElementById('content');
            if (contentDiv.style.display === 'none') {
                alert('请先加载系统信息后再导出！');
                return;
            }

            try {
                const info = await ipcRenderer.invoke('get-system-info');
                const result = await ipcRenderer.invoke('export-to-file', info);

                if (result.success) {
                    alert('✅ 导出成功！\n文件已保存到: ' + result.filePath);
                } else {
                    alert('❌ 导出失败: ' + result.error);
                }
            } catch (error) {
                console.error('Export error:', error);
                alert('❌ 导出过程中发生错误: ' + error.message);
            }
        }

          /**
           * 监听来自菜单栏的刷新命令
           */
          ipcRenderer.on('refresh-system-info', () => {
              console.log('收到刷新命令');
              loadSystemInfo();
          });

          /**
           * 监听来自菜单栏的导出命令
           */
          /**
           * 打开日历窗口
           */
          function openCalendar() {
              ipcRenderer.invoke('open-calendar');
          }

</script>
</body>
</html>
<script src="export-fix.js"></script>
<script src="calendar-fix.js"></script>
