<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片尺寸调节工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .header-icon {
      font-size: 32px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
    }
    
    .file-section {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      min-width: 280px;
    }
    
    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #e9ecef;
      color: #495057;
    }
    
    .btn-secondary:hover {
      background: #dee2e6;
    }
    
    .btn-success {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .file-name {
      font-size: 14px;
      color: #666;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .size-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      min-width: 320px;
    }
    
    .size-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .size-input-group label {
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    
    .size-input {
      width: 80px;
      padding: 10px 12px;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      transition: border-color 0.3s;
    }
    
    .size-input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .size-separator {
      font-size: 18px;
      color: #999;
      font-weight: 300;
    }
    
    .aspect-ratio-control {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    
    .aspect-ratio-control input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .aspect-ratio-control label {
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }
    
    .preview-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #e0e0e0;
      transition: border-color 0.3s;
    }
    
    .preview-section.has-image {
      border-style: solid;
      border-color: #667eea;
    }
    
    .preview-placeholder {
      text-align: center;
      color: #999;
    }
    
    .preview-placeholder-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }
    
    .preview-placeholder p {
      font-size: 16px;
    }
    
    .preview-image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      max-height: 500px;
    }
    
    .preview-image {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    
    .image-info {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      width: 100%;
    }
    
    .image-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .image-info-row:last-child {
      margin-bottom: 0;
    }
    
    .image-info-label {
      color: #666;
    }
    
    .image-info-value {
      color: #333;
      font-weight: 600;
    }
    
    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      justify-content: center;
    }
    
    .tips {
      margin-top: 20px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 8px;
      border-left: 4px solid #2196f3;
    }
    
    .tips h3 {
      font-size: 14px;
      color: #1976d2;
      margin-bottom: 8px;
    }
    
    .tips ul {
      margin-left: 18px;
      color: #555;
      font-size: 13px;
      line-height: 1.8;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1001;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .toast.success {
      background: #4caf50;
    }
    
    .toast.error {
      background: #f44336;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span class="header-icon">📐</span>
        图片尺寸调节工具
      </h1>
    </div>
    
    <div class="controls">
      <div class="file-section">
        <button id="selectFileBtn" class="btn btn-primary">
          <span>📁</span>
          选择文件
        </button>
        <span id="fileName" class="file-name">未选择任何文件</span>
      </div>
      
      <div class="size-controls">
        <div class="size-input-group">
          <label for="widthInput">宽:</label>
          <input type="number" id="widthInput" class="size-input" placeholder="800" min="1" max="10000">
        </div>
        
        <span class="size-separator">×</span>
        
        <div class="size-input-group">
          <input type="number" id="heightInput" class="size-input" placeholder="600" min="1" max="10000">
        </div>
        
        <div class="aspect-ratio-control">
          <input type="checkbox" id="lockAspectRatio" checked>
          <label for="lockAspectRatio">锁定比例</label>
        </div>
      </div>
    </div>
    
    <div class="action-buttons">
      <button id="saveBtn" class="btn btn-success" disabled>
        <span>💾</span>
        保存图片
      </button>
    </div>
    
    <div id="previewSection" class="preview-section">
      <div class="preview-placeholder">
        <div class="preview-placeholder-icon">🖼️</div>
        <p>请选择一张图片开始调节尺寸</p>
      </div>
    </div>
    
    <div class="tips">
      <h3>使用提示</h3>
      <ul>
        <li>上传图片后，可自由调整尺寸</li>
        <li>勾选"锁定比例"避免图像变形</li>
        <li>支持 JPG、PNG、GIF、BMP、WebP 等常见格式</li>
        <li>调整后的图片可保存为 PNG 或 JPEG 格式</li>
      </ul>
    </div>
  </div>
  
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>
  
  <div id="toast" class="toast"></div>

  <script>
    //created by AI
    // 图片尺寸调节工具 - 渲染进程脚本
    // 功能：选择图片、调整尺寸、锁定宽高比、预览、保存
    //created by AI//
    
    const { ipcRenderer } = require('electron');
    
    // DOM 元素
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileName = document.getElementById('fileName');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const lockAspectRatio = document.getElementById('lockAspectRatio');
    const saveBtn = document.getElementById('saveBtn');
    const previewSection = document.getElementById('previewSection');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const toast = document.getElementById('toast');
    
    // 状态变量
    let originalImage = null;
    let originalWidth = 0;
    let originalHeight = 0;
    let aspectRatio = 1;
    let currentFilePath = '';
    let currentFileName = '';
    
    // 显示提示消息
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
    
    // 显示加载状态
    function showLoading(show) {
      if (show) {
        loadingOverlay.classList.add('active');
      } else {
        loadingOverlay.classList.remove('active');
      }
    }
    
    // 选择文件按钮事件
    selectFileBtn.addEventListener('click', async () => {
      try {
        const result = await ipcRenderer.invoke('select-image-file');
        
        if (!result.canceled && result.filePaths.length > 0) {
          const filePath = result.filePaths[0];
          await loadImage(filePath);
        }
      } catch (error) {
        console.error('选择文件失败:', error);
        showToast('选择文件失败: ' + error.message, 'error');
      }
    });
    
    // 加载图片
    async function loadImage(filePath) {
      showLoading(true);
      
      try {
        currentFilePath = filePath;
        currentFileName = filePath.split(/[\\/]/).pop();
        
        originalImage = new Image();
        
        await new Promise((resolve, reject) => {
          originalImage.onload = resolve;
          originalImage.onerror = reject;
          originalImage.src = 'file://' + filePath;
        });
        
        originalWidth = originalImage.naturalWidth;
        originalHeight = originalImage.naturalHeight;
        aspectRatio = originalWidth / originalHeight;
        
        // 更新输入框
        widthInput.value = originalWidth;
        heightInput.value = originalHeight;
        
        // 更新文件名显示
        fileName.textContent = currentFileName;
        
        // 更新预览
        updatePreview();
        
        // 启用保存按钮
        saveBtn.disabled = false;
        
        // 添加 has-image 类
        previewSection.classList.add('has-image');
        
        showToast('图片加载成功');
      } catch (error) {
        console.error('加载图片失败:', error);
        showToast('加载图片失败: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    }
    
    // 更新预览
    function updatePreview() {
      if (!originalImage) return;
      
      const width = parseInt(widthInput.value) || originalWidth;
      const height = parseInt(heightInput.value) || originalHeight;
      
      // 创建 canvas 进行缩放
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(originalImage, 0, 0, width, height);
      
      // 清空预览区域
      previewSection.innerHTML = '';
      
      // 创建预览容器
      const container = document.createElement('div');
      container.className = 'preview-image-container';
      
      // 创建图片元素
      const img = document.createElement('img');
      img.className = 'preview-image';
      img.src = canvas.toDataURL('image/png');
      img.alt = '预览图片';
      
      container.appendChild(img);
      previewSection.appendChild(container);
      
      // 添加图片信息
      const infoDiv = document.createElement('div');
      infoDiv.className = 'image-info';
      infoDiv.innerHTML = `
        <div class="image-info-row">
          <span class="image-info-label">原始尺寸:</span>
          <span class="image-info-value">${originalWidth} × ${originalHeight} 像素</span>
        </div>
        <div class="image-info-row">
          <span class="image-info-label">调整后尺寸:</span>
          <span class="image-info-value">${width} × ${height} 像素</span>
        </div>
        <div class="image-info-row">
          <span class="image-info-label">缩放比例:</span>
          <span class="image-info-value">${((width / originalWidth) * 100).toFixed(1)}%</span>
        </div>
      `;
      previewSection.appendChild(infoDiv);
    }
    
    // 宽度输入事件
    widthInput.addEventListener('input', () => {
      if (!originalImage) return;
      
      let width = parseInt(widthInput.value);
      if (isNaN(width) || width < 1) {
        width = 1;
        widthInput.value = width;
      }
      
      if (lockAspectRatio.checked) {
        const height = Math.round(width / aspectRatio);
        heightInput.value = height;
      }
      
      updatePreview();
    });
    
    // 高度输入事件
    heightInput.addEventListener('input', () => {
      if (!originalImage) return;
      
      let height = parseInt(heightInput.value);
      if (isNaN(height) || height < 1) {
        height = 1;
        heightInput.value = height;
      }
      
      if (lockAspectRatio.checked) {
        const width = Math.round(height * aspectRatio);
        widthInput.value = width;
      }
      
      updatePreview();
    });
    
    // 锁定比例复选框事件
    lockAspectRatio.addEventListener('change', () => {
      if (!originalImage) return;
      
      if (lockAspectRatio.checked) {
        // 重新计算宽高比
        const width = parseInt(widthInput.value) || originalWidth;
        const height = parseInt(heightInput.value) || originalHeight;
        aspectRatio = width / height;
      }
    });
    
    // 保存按钮事件
    saveBtn.addEventListener('click', async () => {
      if (!originalImage) {
        showToast('请先选择图片', 'error');
        return;
      }
      
      const width = parseInt(widthInput.value) || originalWidth;
      const height = parseInt(heightInput.value) || originalHeight;
      
      // 生成默认文件名
      const nameParts = currentFileName.split('.');
      const ext = nameParts.pop();
      const baseName = nameParts.join('.');
      const defaultName = `${baseName}_${width}x${height}.png`;
      
      try {
        const result = await ipcRenderer.invoke('save-resized-image', {
          defaultName: defaultName
        });
        
        if (!result.canceled) {
          showLoading(true);
          
          // 创建 canvas 生成最终图片
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(originalImage, 0, 0, width, height);
          
          // 获取图片数据
          const dataUrl = canvas.toDataURL('image/png');
          
          // 保存文件
          const writeResult = await ipcRenderer.invoke('write-image-file', {
            filePath: result.filePath,
            dataUrl: dataUrl
          });
          
          if (writeResult.success) {
            showToast('图片保存成功！');
          } else {
            showToast('保存失败: ' + writeResult.error, 'error');
          }
        }
      } catch (error) {
        console.error('保存图片失败:', error);
        showToast('保存图片失败: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    });
    
    // 页面加载完成提示
    console.log('图片尺寸调节工具已加载');
  </script>
</body>
</html>
