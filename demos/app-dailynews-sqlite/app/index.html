<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>主窗口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 40px auto;
      max-width: 900px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
    }
    
    #info {
      margin-bottom: 40px;
      color: #666;
    }
    
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .category {
      border: 1px dashed #ccc;
      padding: 20px;
      border-radius: 8px;
    }
    
    .category h2 {
      font-size: 18px;
      color: #1a73e8;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .category button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f8f9fa;
      transition: all 0.2s;
    }
    
    .category button:hover {
      background: #e3f2fd;
      border-color: #1a73e8;
    }
    
    .notification-box {
      border: 1px dashed #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .notification-box button {
      margin: 0;
    }
    
    .typical-app {
      border: 1px dashed #ccc;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .typical-app h2 {
      font-size: 18px;
      color: #1a73e8;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .typical-app button {
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f8f9fa;
      transition: all 0.2s;
    }
    
    .typical-app button:hover {
      background: #e3f2fd;
      border-color: #1a73e8;
    }
    
    .hidden {
      display: none;
    }
    
    .file-path {
      margin: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      word-break: break-all;
    }
    
    .clipboard-content {
      margin: 20px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 5px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>欢迎使用 Electron 应用</h1>
  <p id="info"></p>
  
  <div class="container">
    <div class="category">
      <h2>窗口类</h2>
      <button id="open">打开子窗口</button>
      <button id="openFloat">打开悬浮窗</button>
    </div>
    
    <div class="category">
      <h2>文件&剪切板操作</h2>
      <button id="fileClipboardTest">选文件和剪切板测试</button>
      <div class="notification-box">
        <button id="openNotification">系统通知</button>
      </div>
    </div>
    
    <div class="category">
      <h2>媒体相关</h2>
      <button id="openScreenRecorder">屏幕录制</button>
      <button id="openCamera">摄像头调用测试</button>
      <button id="openImageResizer">图片尺寸调节</button>
      <button id="openImageEditor">图片编辑</button>
    </div>
    
    <div class="category">
      <h2>硬件相关</h2>
      <button id="openLocation">获取IP地址</button>
      <button id="openDeviceInfo">硬件信息</button>
    </div>
    
    <div class="category">
      <h2>文件类</h2>
      <button id="webFileDownload">web文件下载</button>
      <button id="uploadFile">上传文件</button>
    </div>
    
    <div class="category">
      <h2>打印操作</h2>
      <button id="printPreview">打印预览</button>
    </div>
    
    <div class="category">
      <h2>三方库调用</h2>
      <button id="openLodash">lodash</button>
      <button id="openAxios">axios</button>
    </div>
  </div>
  
  <div class="typical-app">
    <h2>典型应用</h2>
    <button id="openSnake">贪食蛇游戏</button>
    <button id="openOCR">OCR识别功能</button>
    <button id="openZaobao">每日早报</button>
  </div>
  
  <div id="fileClipboardSection" class="hidden">
    <h2>文件选择和剪贴板测试</h2>
    <div>
      <button id="filePicker">选择文件</button>
      <button id="readClipboard">读取剪贴板</button>
    </div>
    <div id="filePathDisplay" class="hidden">
      <p><strong>选择的文件路径：</strong></p>
      <div id="filePath" class="file-path"></div>
      <button id="copyPath">复制路径</button>
    </div>
    <div id="clipboardDisplay" class="hidden">
      <p><strong>剪贴板内容：</strong></p>
      <div id="clipboardContent" class="clipboard-content"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
