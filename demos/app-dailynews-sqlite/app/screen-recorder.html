<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>屏幕录制器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    
    .recorder-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 28px;
      color: #e74c3c;
      text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
      margin-bottom: 10px;
    }
    
    .header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }
    
    .source-selection {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .source-selection h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #4ecca3;
    }
    
    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      max-height: 300px;
      overflow-y: auto;
      padding: 5px;
    }
    
    .source-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .source-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #4ecca3;
    }
    
    .source-item.selected {
      border-color: #e74c3c;
      background: rgba(231, 76, 60, 0.2);
    }
    
    .source-thumbnail {
      width: 100%;
      height: 120px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .source-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .source-name {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .control-btn {
      padding: 15px 40px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .record-btn {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
    }
    
    .record-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
    }
    
    .record-btn:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    .stop-btn {
      background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
      color: #1a1a2e;
    }
    
    .stop-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
    }
    
    .stop-btn:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    .status-panel {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
    }
    
    .status-dot.recording {
      background: #e74c3c;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .timer {
      font-size: 48px;
      font-family: 'Courier New', monospace;
      color: #4ecca3;
      text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
      margin-bottom: 10px;
    }
    
    .file-info {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 15px;
      overflow: hidden;
      display: none;
    }
    
    .progress-bar.active {
      display: block;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ecca3, #2ecc71);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .preview-section {
      margin-top: 20px;
      display: none;
    }
    
    .preview-section.active {
      display: block;
    }
    
    .preview-section h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #4ecca3;
    }
    
    .preview-video {
      width: 100%;
      max-height: 400px;
      background: #000;
      border-radius: 8px;
      border: 2px solid #4ecca3;
    }
    
    .save-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    
    .save-btn {
      padding: 12px 30px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .save-btn.primary {
      background: linear-gradient(135deg, #4ecca3 0%, #2ecc71 100%);
      color: #1a1a2e;
    }
    
    .save-btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .save-btn:hover {
      transform: scale(1.05);
    }
    
    .message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      display: none;
    }
    
    .message.success {
      background: #2ecc71;
      color: white;
    }
    
    .message.error {
      background: #e74c3c;
      color: white;
    }
    
    .message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }
    
    @keyframes slideDown {
      from { top: -50px; opacity: 0; }
      to { top: 20px; opacity: 1; }
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #4ecca3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="recorder-container">
    <div class="header">
      <h1>屏幕录制器</h1>
      <p>选择要录制的屏幕或窗口，然后点击录制按钮开始</p>
    </div>
    
    <div class="source-selection">
      <h2>需要先选中录制源</h2>
      <div id="sourceGrid" class="source-grid">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>正在获取屏幕源...</p>
        </div>
      </div>
    </div>
    

    
    <div class="controls">
      <button id="recordBtn" class="control-btn record-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10"/>
        </svg>
        开始录制
      </button>
      <button id="stopBtn" class="control-btn stop-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        停止录制
      </button>
    </div>
    
    <div class="status-panel">
      <div class="status-indicator">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText" class="status-text">等待开始录制</span>
      </div>
      <div id="timer" class="timer">00:00:00</div>
      <div id="fileInfo" class="file-info"></div>
      <div id="progressBar" class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>
    
    <div id="previewSection" class="preview-section">
      <h2>录制预览</h2>
      <video id="previewVideo" class="preview-video" controls></video>
      <div class="save-controls">
        <button id="saveBtn" class="save-btn primary">保存视频</button>
        <button id="newRecordBtn" class="save-btn secondary">新建录制</button>
      </div>
    </div>
  </div>
  
  <div id="message" class="message"></div>

  <script>
    const { ipcRenderer, desktopCapturer } = require('electron');
    
    let selectedSource = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = null;
    let timerInterval = null;
    let recordedBlob = null;
    
    const sourceGrid = document.getElementById('sourceGrid');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const timerDisplay = document.getElementById('timer');
    const fileInfo = document.getElementById('fileInfo');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const previewSection = document.getElementById('previewSection');
    const previewVideo = document.getElementById('previewVideo');
    const saveBtn = document.getElementById('saveBtn');
    const newRecordBtn = document.getElementById('newRecordBtn');
    const messageEl = document.getElementById('message');
    
    async function loadSources() {
      try {
        const sources = await ipcRenderer.invoke('get-sources');
        
        sourceGrid.innerHTML = '';
        
        if (sources.length === 0) {
          sourceGrid.innerHTML = '<div class="loading"><p>未找到可录制的屏幕源</p></div>';
          return;
        }
        
        sources.forEach((source) => {
          const item = document.createElement('div');
          item.className = 'source-item';
          item.dataset.id = source.id;
          
          const thumbnail = document.createElement('div');
          thumbnail.className = 'source-thumbnail';
          
          const img = document.createElement('img');
          img.src = source.thumbnail;
          img.alt = source.name;
          thumbnail.appendChild(img);
          
          const name = document.createElement('div');
          name.className = 'source-name';
          name.textContent = source.name;
          name.title = source.name;
          
          item.appendChild(thumbnail);
          item.appendChild(name);
          
          item.addEventListener('click', () => selectSource(source, item));
          
          sourceGrid.appendChild(item);
        });
        
      } catch (error) {
        console.error('Failed to get sources:', error);
        sourceGrid.innerHTML = '<div class="loading"><p>获取屏幕源失败: ' + error.message + '</p></div>';
      }
    }
    
    function selectSource(source, element) {
      document.querySelectorAll('.source-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      element.classList.add('selected');
      selectedSource = source;
      recordBtn.disabled = false;
      
      showMessage('已选择: ' + source.name, 'success');
    }
    
    async function startRecording() {
      if (!selectedSource) {
        showMessage('请先选择要录制的屏幕源', 'error');
        return;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: selectedSource.id,
              minWidth: 1280,
              maxWidth: 1920,
              minHeight: 720,
              maxHeight: 1080
            }
          }
        });
        
        recordedChunks = [];
        
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9'
        });
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };
        
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(recordedBlob);
          previewVideo.src = url;
          previewSection.classList.add('active');
          
          const sizeMB = (recordedBlob.size / (1024 * 1024)).toFixed(2);
          fileInfo.textContent = `录制完成 - 文件大小: ${sizeMB} MB`;
          
          stream.getTracks().forEach(track => track.stop());
        };
        
        mediaRecorder.start(1000);
        
        recordingStartTime = Date.now();
        startTimer();
        
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        statusDot.classList.add('recording');
        statusText.textContent = '正在录制...';
        fileInfo.textContent = '录制源: ' + selectedSource.name;
        
        showMessage('录制已开始', 'success');
        
      } catch (error) {
        console.error('Failed to start recording:', error);
        showMessage('录制失败: ' + error.message, 'error');
      }
    }
    
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        stopTimer();
        
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        statusDot.classList.remove('recording');
        statusText.textContent = '录制完成';
        
        showMessage('录制已停止', 'success');
      }
    }
    
    function startTimer() {
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - recordingStartTime;
        timerDisplay.textContent = formatTime(elapsed);
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      
      return [hours, minutes, seconds]
        .map(v => v.toString().padStart(2, '0'))
        .join(':');
    }
    
    async function saveVideo() {
      if (!recordedBlob) {
        showMessage('没有可保存的录制内容', 'error');
        return;
      }
      
      try {
        const buffer = await recordedBlob.arrayBuffer();
        const result = await ipcRenderer.invoke('save-video', {
          defaultName: `screen-record-${Date.now()}.webm`
        });
        
        if (result && !result.canceled && result.filePath) {
          progressBar.classList.add('active');
          
          await ipcRenderer.invoke('write-video-file', {
            filePath: result.filePath,
            buffer: buffer
          });
          
          progressFill.style.width = '100%';
          
          setTimeout(() => {
            progressBar.classList.remove('active');
            progressFill.style.width = '0%';
          }, 1000);
          
          showMessage('视频已保存到: ' + result.filePath, 'success');
        }
      } catch (error) {
        console.error('Failed to save video:', error);
        showMessage('保存失败: ' + error.message, 'error');
      }
    }
    
    function newRecording() {
      previewSection.classList.remove('active');
      previewVideo.src = '';
      recordedBlob = null;
      recordedChunks = [];
      timerDisplay.textContent = '00:00:00';
      fileInfo.textContent = '';
      statusText.textContent = '等待开始录制';
      selectedSource = null;
      recordBtn.disabled = true;
      
      // 隐藏预览区域
      const previewArea = document.getElementById('previewArea');
      previewArea.style.display = 'none';
      
      document.querySelectorAll('.source-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      loadSources();
    }
    
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type + ' show';
      
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 3000);
    }
    
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    saveBtn.addEventListener('click', saveVideo);
    newRecordBtn.addEventListener('click', newRecording);
    
    loadSources();
  </script>
</body>
</html>
