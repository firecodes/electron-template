<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>位置信息</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
    }
    .label {
      font-weight: bold;
      color: #666;
    }
    .value {
      color: #1976D2;
      font-weight: bold;
    }
    button {
      padding: 10px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      margin-top: 20px;
      margin-right: 10px;
    }
    button:hover {
      background: #1565C0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      color: #666;
      margin: 10px 0;
      font-size: 14px;
    }
    .error {
      color: #f44336;
      margin: 10px 0;
    }
    .source {
      color: #999;
      font-size: 12px;
      margin-top: 10px;
    }
    .debug-panel {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }
    .debug-panel h3 {
      color: #4ecca3;
      margin-bottom: 10px;
    }
    .debug-log {
      color: #aaa;
      margin: 5px 0;
      word-break: break-all;
    }
    .debug-log.success {
      color: #4ecca3;
    }
    .debug-log.error {
      color: #e74c3c;
    }
    .debug-log.info {
      color: #3498db;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>当前位置信息</h2>
    <div id="status" class="status">正在获取位置信息...</div>
    <div id="error" class="error"></div>
    <div class="info-row">
      <span class="label">纬度:</span>
      <span id="latitude" class="value">--</span>
    </div>
    <div class="info-row">
      <span class="label">经度:</span>
      <span id="longitude" class="value">--</span>
    </div>
    <div class="info-row">
      <span class="label">精度:</span>
      <span id="accuracy" class="value">--</span>
    </div>
    <div id="source" class="source"></div>
    <button id="refreshBtn" onclick="refreshLocation()">刷新位置</button>
    <button onclick="closeWindow()">关闭</button>
  </div>
  
  <div class="debug-panel">
    <h3>调试信息</h3>
    <div id="debugLog"></div>
  </div>

  <script>
    //created by AI
    // 位置获取功能 - 通过Electron IPC请求权限，然后使用浏览器API获取位置
    
    const { ipcRenderer } = require('electron');
    
    var debugLogEl = document.getElementById('debugLog');
    var isLoading = false;
    
    function debugLog(message, type) {
      type = type || 'info';
      var logEntry = document.createElement('div');
      logEntry.className = 'debug-log ' + type;
      logEntry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
      debugLogEl.appendChild(logEntry);
      debugLogEl.scrollTop = debugLogEl.scrollHeight;
      console.log(message);
    }
    
    function debugLogClear() {
      debugLogEl.innerHTML = '';
    }
    
    window.onload = function() {
      debugLog('页面加载完成，开始获取位置...', 'info');
      requestPermissionAndGetLocation();
    };
    
    async function requestPermissionAndGetLocation() {
      if (isLoading) return;
      isLoading = true;
      
      var statusEl = document.getElementById('status');
      var errorEl = document.getElementById('error');
      var refreshBtn = document.getElementById('refreshBtn');
      
      statusEl.textContent = '正在请求位置权限...';
      errorEl.textContent = '';
      refreshBtn.disabled = true;
      
      debugLog('=== 开始请求位置权限 ===', 'info');
      
      try {
        // 先请求位置权限
        var permResult = await ipcRenderer.invoke('request-location-permission');
        debugLog('权限请求结果: ' + JSON.stringify(permResult), permResult.granted ? 'success' : 'error');
        
        if (!permResult.granted) {
          statusEl.textContent = '';
          errorEl.textContent = '位置权限被拒绝，无法获取位置信息';
          refreshBtn.disabled = false;
          isLoading = false;
          return;
        }
        
        // 权限已获取，开始获取位置
        getCurrentLocation();
      } catch (e) {
        debugLog('请求权限异常: ' + e.message, 'error');
        statusEl.textContent = '';
        errorEl.textContent = '请求权限异常: ' + e.message;
        refreshBtn.disabled = false;
        isLoading = false;
      }
    }
    
    async function getCurrentLocation() {
      var statusEl = document.getElementById('status');
      var errorEl = document.getElementById('error');
      var latEl = document.getElementById('latitude');
      var lngEl = document.getElementById('longitude');
      var accEl = document.getElementById('accuracy');
      var sourceEl = document.getElementById('source');
      var refreshBtn = document.getElementById('refreshBtn');
      
      statusEl.textContent = '正在获取位置信息...';
      debugLog('开始获取位置...', 'info');
      
      try {
        // 通过IPC调用HarmonyOS原生位置服务
        debugLog('调用HarmonyOS原生位置服务...', 'info');
        var result = await ipcRenderer.invoke('get-harmonyos-location');
        debugLog('位置服务返回: ' + JSON.stringify(result), result.success ? 'success' : 'error');
        
        if (result.success && result.location) {
          isLoading = false;
          refreshBtn.disabled = false;
          
          var latitude = result.location.latitude.toFixed(6);
          var longitude = result.location.longitude.toFixed(6);
          var accuracy = result.location.accuracy ? result.location.accuracy.toFixed(2) + ' 米' : '--';
          
          latEl.textContent = latitude;
          lngEl.textContent = longitude;
          accEl.textContent = accuracy;
          statusEl.textContent = '位置获取成功';
          sourceEl.textContent = '数据来源: HarmonyOS原生定位服务';
          
          debugLog('位置获取成功: lat=' + latitude + ', lng=' + longitude + ', accuracy=' + accuracy, 'success');
        } else {
          isLoading = false;
          refreshBtn.disabled = false;
          
          // 检查是否是HarmonyOS原生服务不可用
          if (result.error && result.error.includes('HarmonyOS原生服务在当前环境中不可用')) {
            statusEl.textContent = '';
            errorEl.innerHTML = 'Electron环境无法直接访问HarmonyOS原生位置服务。<br>请关闭此窗口，点击主界面的"位置获取"按钮，<br>系统会自动打开HarmonyOS原生位置窗口。';
            sourceEl.textContent = '';
            debugLog('HarmonyOS原生服务不可用，请使用原生位置窗口', 'error');
          } else {
            statusEl.textContent = '';
            errorEl.textContent = result.error || '获取位置失败';
            sourceEl.textContent = '';
            debugLog('位置获取失败: ' + (result.error || '未知错误'), 'error');
          }
        }
      } catch (e) {
        isLoading = false;
        refreshBtn.disabled = false;
        
        statusEl.textContent = '';
        errorEl.textContent = '获取位置异常: ' + e.message;
        sourceEl.textContent = '';
        debugLog('获取位置异常: ' + e.message, 'error');
      }
    }
    
    function refreshLocation() {
      debugLogClear();
      requestPermissionAndGetLocation();
    }
    
    function closeWindow() {
      window.close();
    }
    //created by AI//
  </script>
</body>
</html>
