<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>贪食蛇游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    
    .game-container {
      text-align: center;
      padding: 20px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #4ecca3;
      text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
    }
    
    .score-board {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .score-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(78, 204, 163, 0.3);
    }
    
    .score-item span {
      color: #4ecca3;
      font-weight: bold;
    }
    
    #gameCanvas {
      border: 3px solid #4ecca3;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
      background: #0f0f23;
    }
    
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    button {
      padding: 12px 30px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-weight: bold;
    }
    
    #startBtn {
      background: linear-gradient(135deg, #4ecca3 0%, #38a87e 100%);
      color: #1a1a2e;
    }
    
    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(78, 204, 163, 0.5);
    }
    
    #pauseBtn {
      background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
      color: #1a1a2e;
    }
    
    #pauseBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    }
    
    .instructions {
      margin-top: 15px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    .instructions p {
      margin: 5px 0;
    }
    
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 30px 50px;
      border-radius: 15px;
      border: 2px solid #e74c3c;
      text-align: center;
      display: none;
    }
    
    .game-over h2 {
      color: #e74c3c;
      font-size: 32px;
      margin-bottom: 15px;
    }
    
    .game-over p {
      font-size: 20px;
      margin-bottom: 20px;
    }
    
    .mobile-controls {
      display: none;
      margin-top: 15px;
      gap: 5px;
    }
    
    .mobile-controls .row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    
    .mobile-btn {
      width: 50px;
      height: 50px;
      font-size: 20px;
      background: rgba(78, 204, 163, 0.3);
      border: 1px solid #4ecca3;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .mobile-btn:active {
      background: rgba(78, 204, 163, 0.6);
    }
    
    @media (max-width: 500px) {
      .mobile-controls {
        display: block;
      }
      
      #gameCanvas {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>贪食蛇</h1>
    
    <div class="score-board">
      <div class="score-item">得分: <span id="score">0</span></div>
      <div class="score-item">最高分: <span id="highScore">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
      <button id="startBtn">开始游戏</button>
      <button id="pauseBtn">暂停</button>
    </div>
    
    <div class="instructions">
      <p>使用方向键或 WASD 控制蛇的移动</p>
      <p>按空格键暂停/继续游戏</p>
    </div>
    
    <div class="mobile-controls">
      <div class="row">
        <button class="mobile-btn" id="upBtn">↑</button>
      </div>
      <div class="row">
        <button class="mobile-btn" id="leftBtn">←</button>
        <button class="mobile-btn" id="downBtn">↓</button>
        <button class="mobile-btn" id="rightBtn">→</button>
      </div>
    </div>
    
    <div class="game-over" id="gameOver">
      <h2>游戏结束!</h2>
      <p>你的得分: <span id="finalScore">0</span></p>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [];
    let food = { x: 0, y: 0 };
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameLoop = null;
    let isRunning = false;
    let isPaused = false;
    let gameSpeed = 100;
    
    highScoreEl.textContent = highScore;
    
    function initGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      gameSpeed = 100;
      spawnFood();
      gameOverEl.style.display = 'none';
    }
    
    function spawnFood() {
      let validPosition = false;
      while (!validPosition) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        validPosition = true;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === food.x && snake[i].y === food.y) {
            validPosition = false;
            break;
          }
        }
      }
    }
    
    function draw() {
      ctx.fillStyle = '#0f0f23';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = 'rgba(78, 204, 163, 0.1)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }
      
      ctx.fillStyle = '#e74c3c';
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;
      
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        const isHead = i === 0;
        
        if (isHead) {
          ctx.fillStyle = '#4ecca3';
          ctx.shadowColor = '#4ecca3';
          ctx.shadowBlur = 10;
        } else {
          const gradient = ctx.createLinearGradient(
            segment.x * gridSize,
            segment.y * gridSize,
            segment.x * gridSize + gridSize,
            segment.y * gridSize + gridSize
          );
          gradient.addColorStop(0, '#38a87e');
          gradient.addColorStop(1, '#2d8a6a');
          ctx.fillStyle = gradient;
          ctx.shadowBlur = 0;
        }
        
        ctx.beginPath();
        ctx.roundRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2,
          isHead ? 6 : 4
        );
        ctx.fill();
        
        if (isHead) {
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 0;
          const eyeSize = 3;
          const eyeOffset = 5;
          
          if (direction.x === 1) {
            ctx.beginPath();
            ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          } else if (direction.x === -1) {
            ctx.beginPath();
            ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          } else if (direction.y === -1) {
            ctx.beginPath();
            ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
    
    function update() {
      direction = { x: nextDirection.x, y: nextDirection.y };
      
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }
      
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver();
          return;
        }
      }
      
      snake.unshift(head);
      
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        
        spawnFood();
        
        if (gameSpeed > 50) {
          gameSpeed -= 2;
          clearInterval(gameLoop);
          gameLoop = setInterval(gameStep, gameSpeed);
        }
      } else {
        snake.pop();
      }
    }
    
    function gameStep() {
      if (!isPaused) {
        update();
        draw();
      }
    }
    
    function startGame() {
      if (isRunning) {
        return;
      }
      
      initGame();
      isRunning = true;
      isPaused = false;
      startBtn.textContent = '游戏中...';
      startBtn.disabled = true;
      pauseBtn.textContent = '暂停';
      
      draw();
      gameLoop = setInterval(gameStep, gameSpeed);
    }
    
    function togglePause() {
      if (!isRunning) return;
      
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '继续' : '暂停';
    }
    
    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      gameLoop = null;
      
      finalScoreEl.textContent = score;
      gameOverEl.style.display = 'block';
      
      startBtn.textContent = '开始游戏';
      startBtn.disabled = false;
    }
    
    function changeDirection(newDir) {
      if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
        if (newDir.x !== direction.x || newDir.y !== direction.y) {
          nextDirection = { x: newDir.x, y: newDir.y };
        }
      }
    }
    
    document.addEventListener('keydown', function(e) {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          changeDirection({ x: 0, y: -1 });
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          changeDirection({ x: 0, y: 1 });
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault();
          changeDirection({ x: -1, y: 0 });
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault();
          changeDirection({ x: 1, y: 0 });
          break;
        case ' ':
          e.preventDefault();
          if (isRunning) {
            togglePause();
          } else {
            startGame();
          }
          break;
      }
    });
    
    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', startGame);
    
    document.getElementById('upBtn').addEventListener('click', function() {
      changeDirection({ x: 0, y: -1 });
    });
    document.getElementById('downBtn').addEventListener('click', function() {
      changeDirection({ x: 0, y: 1 });
    });
    document.getElementById('leftBtn').addEventListener('click', function() {
      changeDirection({ x: -1, y: 0 });
    });
    document.getElementById('rightBtn').addEventListener('click', function() {
      changeDirection({ x: 1, y: 0 });
    });
    
    initGame();
    draw();
  </script>
</body>
</html>
